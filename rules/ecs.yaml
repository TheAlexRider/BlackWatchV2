# ECS service detections. Transitions are emitted by the service projection
# after hysteresis (2 consecutive failed probes -> down; 1 success -> up), so
# each event represents a real state change, not a single bad probe.

- id: service-down
  title: ECS service down
  description: A monitored ECS service crossed the down threshold (2 consecutive failed probes).
  severity: high
  tags: [ecs, availability]
  match:
    field: action
    op: equals
    value: service.down

- id: service-down-prod-critical
  title: PROD ECS service down — critical override
  description: Promotes any prod-tagged service.down to critical. Match tag promoted via probe_targets.tags.
  severity: critical
  tags: [ecs, prod, availability]
  match:
    all:
      - field: action
        op: equals
        value: service.down
      - field: extra.tags.env
        op: equals
        value: prod

- id: service-degraded
  title: ECS service degraded
  description: Some tasks healthy / some unhealthy, or runningCount under desired but not fully zero.
  severity: medium
  tags: [ecs, availability]
  match:
    field: action
    op: equals
    value: service.degraded

- id: service-up
  title: ECS service recovered
  description: A previously down/degraded service is back up.
  severity: informational
  tags: [ecs, availability]
  match:
    field: action
    op: equals
    value: service.up

- id: probe-agent-stale
  title: VPC probe agent went silent
  description: A per-VPC probe agent stopped reporting. The whole VPC's http/tcp monitoring is offline until it comes back.
  severity: high
  tags: [ecs, monitoring, meta]
  match:
    field: action
    op: equals
    value: probe.agent.stale

- id: probe-agent-recovered
  title: Probe agent recovered
  severity: informational
  tags: [ecs, monitoring, meta]
  match:
    field: action
    op: equals
    value: probe.agent.recovered

- id: probe-agent-first-seen
  title: New probe agent registered
  description: A probe agent reported in for the first time. Verify it's expected.
  severity: informational
  tags: [ecs, monitoring]
  match:
    field: action
    op: equals
    value: probe.agent.first_seen
