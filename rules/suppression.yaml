# Suppression / allowlist rules. action: suppress forces severity to
# informational and tags the event "suppressed" — it stays searchable but does
# not alert. Suppress rules win over alert rules. Scope them tightly so a
# compromised automation identity is not blanket-allowed.

- id: suppress-terraform-ci-expected-changes
  title: Expected Terraform CI automation
  description: >
    The Terraform CI role legitimately makes IAM/network changes during deploys.
    Scoped to the specific change actions it performs, not all of its activity.
  action: suppress
  enabled: true
  tags: [expected-automation]
  match:
    all:
      - field: actor.principal
        op: endswith
        value: ":role/terraform-ci"
      - field: action
        op: in
        value:
          - iam.policy.attach
          - iam.user.create
          - network.sg.authorize_ingress
          - storage.s3.policy.put

- id: suppress-aws-managed-kms-grants
  title: Suppress KMS grants by AWS-managed service roles
  description: >
    AWS Backup, Data Lifecycle Manager, RDS, etc. routinely create KMS grants
    as part of normal operation (every snapshot, every backup). These are
    noise — only IAM-user / non-AWS-managed grants are signal worth alerting on.
    Matches AWS-managed role naming conventions: AWS*DefaultServiceRole,
    AWS*DefaultRole, AWSServiceRoleFor*.
  action: suppress
  enabled: true
  tags: [expected-automation, kms]
  match:
    all:
      - field: action
        op: equals
        value: kms.grant.create
      - field: actor.principal
        op: regex
        # Broader match — any principal whose ARN contains an AWS-managed
        # role naming convention. Covers:
        #   AWSServiceRoleFor*        (service-linked roles)
        #   AWS*DefaultServiceRole    (default service roles)
        #   AWS*DefaultRole           (default roles)
        #   aws-*-role                (some lowercase variants)
        # The trailing `[/:]` boundary lets it match role name mid-ARN
        # regardless of what session name AWS appends.
        value: ":assumed-role/(AWSServiceRoleFor[A-Za-z]+|AWS[A-Za-z]+Default(?:Service)?Role|aws-[a-z-]+-role)[/:]
