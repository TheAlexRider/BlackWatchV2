# EC2 host detections (from the on-host reporter agent). Brute-force
# thresholding (N failures/window) is stateful and arrives in a later phase;
# these are the per-event detections.

- id: host-agent-stale
  title: Host agent stopped reporting
  description: An EC2 agent went quiet past the staleness window — host down or agent killed (possible tamper).
  severity: high
  tags: [host, availability, tamper]
  match:
    field: action
    op: equals
    value: host.agent.stale

- id: host-agent-recovered
  title: Host agent recovered
  description: A previously-stale host is reporting again. Informational; pairs with host.agent.stale.
  severity: informational
  tags: [host, availability]
  match:
    field: action
    op: equals
    value: host.agent.recovered

- id: host-first-seen
  title: New host first seen
  description: A new instance reported in for the first time. Informational; verify it's expected.
  severity: informational
  tags: [host, inventory]
  match:
    field: action
    op: equals
    value: host.first_seen

- id: host-ssh-root-login
  title: Direct root SSH login
  description: A successful SSH login as root — should normally be disabled.
  severity: high
  tags: [host, auth]
  match:
    all:
      - field: action
        op: equals
        value: host.auth.ssh.success
      - field: actor.principal
        op: equals
        value: root

- id: host-ssh-login-failed
  title: Failed SSH login
  description: A single failed SSH login. The brute-force rule below fires when N of these arrive from the same IP within the window.
  severity: low
  tags: [host, auth]
  match:
    field: action
    op: equals
    value: host.auth.ssh.failure

- id: host-ssh-brute-force
  title: SSH brute-force
  description: 5+ failed SSH logins from the same source IP within 5 minutes. Emitted once per IP per window.
  severity: high
  tags: [host, auth, brute-force]
  match:
    field: action
    op: equals
    value: host.bruteforce

- id: host-ssh-brute-force-user
  title: SSH credential stuffing (per-user)
  description: |
    5+ failed SSH logins targeting the same username within 5 minutes, regardless of
    source IP. Catches credential-stuffing / distributed attacks where each IP only
    contributes 1-2 failures (so host-ssh-brute-force never crosses its per-IP threshold).
    Emitted once per username per window.
  severity: high
  tags: [host, auth, brute-force, credential-stuffing]
  match:
    field: action
    op: equals
    value: host.bruteforce.user

- id: host-sudo-failure
  title: sudo failure
  description: A failed sudo attempt — wrong password or not permitted.
  severity: medium
  tags: [host, privilege]
  match:
    field: action
    op: equals
    value: host.sudo.failure

- id: host-ssh-login-success
  title: SSH login
  severity: informational
  tags: [host, auth]
  match:
    field: action
    op: equals
    value: host.auth.ssh.success

- id: host-ssh-password-login
  title: SSH password-based login
  description: |
    A successful SSH login authenticated by password (or keyboard-interactive,
    which is usually PAM-password underneath). Most production boxes should
    have PasswordAuthentication off in sshd_config — key-based only. A
    password success means either the policy isn't enforced, or this is a
    vendor / integration partner reaching in. Worth eyeballing every time.
  severity: medium
  tags: [host, auth, policy]
  match:
    field: action
    op: equals
    value: host.auth.ssh.password.success

# --- Phase B: state-diff detections (derived from snapshot changes) -----------

- id: host-new-authorized-key
  title: New SSH authorized_key added
  description: A new public key was added to a user's authorized_keys — possible backdoor / persistence.
  severity: high
  tags: [host, persistence, ssh]
  match:
    field: action
    op: equals
    value: host.authorized_key.added

- id: host-new-user
  title: New OS user created
  description: A new local user account appeared.
  severity: medium
  tags: [host, persistence]
  match:
    field: action
    op: equals
    value: host.user.added

- id: host-new-listening-port
  title: New listening port opened
  description: A new TCP port started listening on the host.
  severity: medium
  tags: [host, network]
  match:
    field: action
    op: equals
    value: host.port.opened

- id: host-sudoers-changed
  title: sudoers configuration changed
  description: /etc/sudoers or /etc/sudoers.d was modified — possible privilege escalation.
  severity: high
  tags: [host, privilege, persistence]
  match:
    field: action
    op: equals
    value: host.sudoers.changed

# --- Phase C: FIM + persistence + packages -----------------------------------

- id: host-fim-critical-file
  title: Critical file changed
  description: A monitored config/sensitive file changed (sshd_config, passwd, shadow, PAM, …).
  severity: high
  tags: [host, integrity]
  match:
    field: action
    op: equals
    value: host.file.changed

# --- FIM Part 1: file integrity events from the new periodic-baseline scanner -

- id: host-fim-sudoers-changed
  title: sudoers file changed (FIM)
  description: |
    /etc/sudoers or /etc/sudoers.d/* was modified, created, or had its
    permissions/owner changed. Top-tier privilege-escalation signal.
  severity: critical
  tags: [host, integrity, privilege, fim]
  match:
    all:
      - field: action
        op: in
        value:
          - host.fim.modified
          - host.fim.created
          - host.fim.perm_changed
          - host.fim.owner_changed
      - field: extra.path
        op: startswith
        value: /etc/sudoers

- id: host-fim-sshd-config-changed
  title: SSH server config changed (FIM)
  description: |
    sshd_config or a drop-in under sshd_config.d/ was modified. Almost always
    operator action but could indicate persistence (PermitRootLogin, MaxAuthTries
    relaxed, AuthorizedKeysFile redirected).
  severity: high
  tags: [host, integrity, ssh, fim]
  match:
    all:
      - field: action
        op: in
        value:
          - host.fim.modified
          - host.fim.created
          - host.fim.perm_changed
      - field: extra.path
        op: startswith
        value: /etc/ssh/sshd_config

- id: host-fim-authorized-keys-changed
  title: SSH authorized_keys changed (FIM)
  description: |
    An authorized_keys file was modified — somebody added/removed a key. Pairs
    with the snapshot-diff host.authorized_key.added rule but this catches the
    write itself, not just the post-fact diff.
  severity: high
  tags: [host, integrity, ssh, persistence, fim]
  match:
    all:
      - field: action
        op: in
        value:
          - host.fim.modified
          - host.fim.created
      - field: extra.path
        op: icontains
        value: authorized_keys

- id: host-fim-pam-changed
  title: PAM configuration changed (FIM)
  description: |
    Anything under /etc/pam.d/ or /etc/security/ changed. PAM config controls
    auth/account/session policy — abuse here gives persistent backdoors.
  severity: high
  tags: [host, integrity, auth, fim]
  match:
    all:
      - field: action
        op: in
        value:
          - host.fim.modified
          - host.fim.created
          - host.fim.perm_changed
      - field: extra.path
        op: startswith
        value: /etc/pam.d/

- id: host-fim-cron-changed
  title: Cron config changed (FIM)
  description: |
    A file under /etc/cron* changed. Classic persistence vector — the realtime
    FIM watcher catches this before the next cron tick fires.
  severity: high
  tags: [host, integrity, persistence, fim]
  match:
    all:
      - field: action
        op: in
        value:
          - host.fim.modified
          - host.fim.created
      - field: extra.path
        op: startswith
        value: /etc/cron

- id: host-fim-systemd-unit-changed
  title: systemd unit changed (FIM)
  description: |
    A unit file under /etc/systemd/system/ was modified. Could be legit
    operator action or quiet persistence (new service that starts on boot).
  severity: medium
  tags: [host, integrity, persistence, fim]
  match:
    all:
      - field: action
        op: in
        value:
          - host.fim.modified
          - host.fim.created
      - field: extra.path
        op: startswith
        value: /etc/systemd/system/

- id: host-fim-system-binary-changed
  title: System binary changed (FIM)
  description: |
    A binary under /bin, /sbin, /usr/bin, /usr/sbin, /usr/local/bin, or
    /usr/local/sbin changed without a corresponding package update. Strong
    rootkit / trojanized-binary signal.
  severity: high
  tags: [host, integrity, rootkit, fim]
  match:
    all:
      - field: action
        op: equals
        value: host.fim.modified
      - field: extra.path
        op: regex
        value: '^/(usr/)?(local/)?(s?bin)/'

- id: host-fim-generic-modified
  title: Monitored file modified (FIM)
  description: |
    Catch-all for any FIM modification not matched by a more specific rule.
    Severity is medium so it surfaces in the UI without being alarming;
    upgrade via a narrower rule if a specific path needs higher signal.
  severity: medium
  tags: [host, integrity, fim]
  match:
    field: action
    op: equals
    value: host.fim.modified

- id: host-fim-created
  title: New file in monitored path (FIM)
  description: A file appeared in a monitored directory that wasn't there before.
  severity: low
  tags: [host, integrity, fim]
  match:
    field: action
    op: equals
    value: host.fim.created

- id: host-fim-deleted
  title: Monitored file deleted (FIM)
  description: A previously-tracked file is gone. Often legit (config cleanup) but worth surfacing.
  severity: low
  tags: [host, integrity, fim]
  match:
    field: action
    op: equals
    value: host.fim.deleted

- id: host-fim-perm-changed
  title: Monitored file permission changed (FIM)
  description: File mode bits changed without content modification — could be a misconfiguration or a privilege-escalation precursor.
  severity: medium
  tags: [host, integrity, fim]
  match:
    field: action
    op: equals
    value: host.fim.perm_changed

- id: host-fim-owner-changed
  title: Monitored file owner changed (FIM)
  description: uid/gid changed on a monitored file. Almost always intentional; surface for review.
  severity: medium
  tags: [host, integrity, fim]
  match:
    field: action
    op: equals
    value: host.fim.owner_changed

# --- FIM Part 3: whodata-aware rules ----------------------------------------

- id: host-fim-non-root-edit-critical
  title: Non-root user modified a critical file
  description: |
    auditd whodata recorded a non-root uid editing a security-critical
    file (sudoers, sshd_config, shadow, PAM). Either privilege escalation
    happened upstream, or someone has unintended write access. Either way
    this is a top-priority signal.
  severity: critical
  tags: [host, integrity, privilege, fim, whodata]
  match:
    all:
      - field: action
        op: in
        value:
          - host.fim.modified
          - host.fim.perm_changed
          - host.fim.owner_changed
      - field: extra.actor.uid
        op: not_equals
        value: 0
      - field: extra.path
        op: regex
        value: '^/etc/(sudoers|shadow|passwd|gshadow|ssh/sshd_config|pam\.d/|security/)'

- id: host-fim-editor-touched-binary
  title: Interactive editor modified a system binary
  description: |
    A binary under /bin, /sbin, /usr, etc. was modified, and auditd
    recorded an interactive editor (vim, nano, emacs, vi) as the actor.
    Legit operator workflows almost never edit system binaries — this
    is a strong rootkit / supply-chain compromise signal.
  severity: critical
  tags: [host, integrity, rootkit, fim, whodata]
  match:
    all:
      - field: action
        op: equals
        value: host.fim.modified
      - field: extra.path
        op: regex
        value: '^/(usr/)?(local/)?(s?bin)/'
      - field: extra.actor.comm
        op: in
        value: [vim, vi, nano, emacs, ed]

- id: host-cron-changed
  title: Cron job added or changed
  description: A cron file was added, changed, or removed — classic persistence.
  severity: high
  tags: [host, persistence]
  match:
    field: action
    op: equals
    value: host.cron.changed

- id: host-new-systemd-service
  title: New systemd unit enabled
  description: A new service or timer is now enabled at boot — possible persistence.
  severity: medium
  tags: [host, persistence]
  match:
    field: action
    op: equals
    value: host.service.added

- id: host-new-suid
  title: New SUID binary appeared
  description: A new setuid binary on the host — strong privilege-escalation signal.
  severity: high
  tags: [host, privilege-escalation]
  match:
    field: action
    op: equals
    value: host.suid.added

- id: host-packages-changed
  title: Package(s) installed or removed
  description: Installed-package inventory changed (yum/dnf/dpkg) — attacker tooling installed, or security tooling removed.
  severity: medium
  tags: [host, software]
  match:
    field: action
    op: equals
    value: host.packages.changed

# --- Phase 1.0 production additions ------------------------------------------

- id: host-disk-critical
  title: Disk usage critical (>= 95%)
  description: A mounted volume crossed 95% used. Imminent disk-full — services start failing, logs stop, monitoring breaks.
  severity: critical
  tags: [host, capacity]
  match:
    field: action
    op: equals
    value: host.disk.critical

- id: host-disk-warn
  title: Disk usage warning (>= 90%)
  description: A mounted volume crossed 90% used. Recovers automatically below 85% (hysteresis).
  severity: high
  tags: [host, capacity]
  match:
    field: action
    op: equals
    value: host.disk.warn

- id: host-disk-recovered
  title: Disk usage recovered
  description: A volume that was warn/critical fell back below 85%.
  severity: informational
  tags: [host, capacity]
  match:
    field: action
    op: equals
    value: host.disk.recovered

- id: host-kernel-module-added
  title: Kernel module loaded
  description: A new kernel module was loaded — legitimate during package installs; primary rootkit primitive otherwise. Worth eyeballing every time on prod.
  severity: high
  tags: [host, kernel, rootkit]
  match:
    field: action
    op: equals
    value: host.kernel.module.added

- id: host-kernel-module-removed
  title: Kernel module unloaded
  description: A previously-loaded kernel module is gone.
  severity: medium
  tags: [host, kernel]
  match:
    field: action
    op: equals
    value: host.kernel.module.removed

- id: host-process-first-seen
  title: New process executable first seen on host
  description: |
    A process whose command name has never been observed on this host before
    is now running. Per-host learning baseline. Suppression-friendly — a
    legitimate new tool produces ONE event, ever.
  severity: medium
  tags: [host, anomaly]
  match:
    field: action
    op: equals
    value: host.process.first_seen

# --- v1.1 agent additions ----------------------------------------------------
# Memory, CPU baseline anomaly, OOM, rpm-DB health, collector stall watchdog.

- id: host-oom-kill
  title: OOM-killer fired on host
  description: |
    The kernel out-of-memory killer terminated a process. Real signal — tells
    you both an ops problem (something ate memory) and a potential security
    incident (an attacker DoS, a runaway compromised process). Each kernel-log
    OOM line produces one event, deduped by journal cursor.
  severity: high
  tags: [host, memory, kernel]
  match:
    field: action
    op: equals
    value: host.oom_kill

- id: host-memory-exhausted
  title: Host memory >= 95% used
  description: |
    Memory used crossed 95%. Hysteresis: clears at <90% with a `recovered`
    event. Catches the slow-burn precursor that often leads to an OOM kill or
    a hung application.
  severity: high
  tags: [host, memory, capacity]
  match:
    field: action
    op: equals
    value: host.memory.exhausted

- id: host-memory-recovered
  title: Host memory back below 90%
  severity: informational
  tags: [host, memory]
  match:
    field: action
    op: equals
    value: host.memory.recovered

- id: host-cpu-anomaly
  title: Host CPU sustained outside its own baseline
  description: |
    Normalized load (load_1min / cpu_count) exceeded the per-host rolling
    baseline by 3 standard deviations for 10 consecutive minutes, AND was
    above 0.5 in absolute terms. Catches cryptominers and runaway processes
    WITHOUT firing on legit Friday-deploy CPU spikes (which fall under the
    baseline tail). Per-host baseline persists in host_status.extra.
  severity: high
  tags: [host, anomaly, cpu]
  match:
    field: action
    op: equals
    value: host.cpu.anomaly

- id: host-cpu-normal
  title: Host CPU returned to baseline
  severity: informational
  tags: [host, anomaly, cpu]
  match:
    field: action
    op: equals
    value: host.cpu.normal

- id: host-package-db-corrupted
  title: Host rpm/yum DB is corrupted
  description: |
    Lock files (`/var/lib/rpm/__db.*`) present without a live rpm/yum/dnf
    process. The DB is wedged — every package query/install will fail until
    rebuilt. The fix is `rm -f /var/lib/rpm/__db.* && rpm --rebuilddb`. Long
    term: upgrade to Amazon Linux 2023 (sqlite-backed rpm).
  severity: medium
  tags: [host, ops, packages]
  match:
    field: action
    op: equals
    value: host.package_db.corrupted

- id: host-package-db-recovered
  title: Host rpm/yum DB is healthy again
  severity: informational
  tags: [host, ops, packages]
  match:
    field: action
    op: equals
    value: host.package_db.recovered

- id: host-collector-stalled
  title: Host agent collector stopped returning data
  description: |
    A specific collector (e.g. packages, suid) hasn't returned a value in
    3× its interval despite previously working. Tells you within minutes when
    something on the box broke a collector — instead of silently shipping
    stale data until someone notices.
  severity: medium
  tags: [host, agent, meta]
  match:
    field: action
    op: equals
    value: host.collector.stalled

- id: host-collector-recovered
  title: Host agent collector working again
  severity: informational
  tags: [host, agent, meta]
  match:
    field: action
    op: equals
    value: host.collector.recovered
