# AWS IAM / KMS / CloudTrail-tamper detections.
#
# Tag convention for routing:
#   notify:critical  — page immediately (should be ~0/month from a healthy account)
#   notify:high      — Slack warn within the hour
#   notify:medium    — Slack review channel; OK to batch
#   (no notify:* tag) — log only, no Slack
#
# Create 3 notification rules in the UI:
#   • tags contains "notify:critical" → #bw-critical channel
#   • tags contains "notify:high"     → #bw-warnings channel
#   • tags contains "notify:medium"   → #bw-review channel (or quiet daily-digest)

# =========================================================================
# notify:critical — wake someone up
# =========================================================================

- id: aws-cloudtrail-tampering
  title: CloudTrail logging tampered with
  description: CloudTrail was stopped, deleted, or modified — likely anti-forensics.
  severity: critical
  tags: [audit, anti-forensics, aws, "notify:critical"]
  match:
    field: action
    op: in
    value: [cloudtrail.logging.stop, cloudtrail.trail.delete, cloudtrail.trail.update]

- id: aws-mfa-removed
  title: MFA device removed
  description: An MFA device was deactivated or deleted — identity is now weaker.
  severity: critical
  tags: [iam, mfa, aws, "notify:critical"]
  match:
    field: action
    op: in
    value: [iam.mfa.deactivate, iam.mfa.delete]

- id: aws-role-trust-modified
  title: Role trust policy modified
  description: >
    An assume-role trust policy was changed — possible silent backdoor or
    cross-account access expansion.
  severity: critical
  tags: [iam, privilege-escalation, persistence, aws, "notify:critical"]
  match:
    field: action
    op: equals
    value: iam.role.update_trust

- id: aws-admin-policy-attached
  title: Administrator-level policy attached
  description: An AdministratorAccess policy was attached — instant god-mode.
  severity: critical
  tags: [iam, privilege-escalation, aws, "notify:critical"]
  match:
    all:
      - field: action
        op: equals
        value: iam.policy.attach
      - field: target.id
        op: icontains
        value: AdministratorAccess

- id: aws-kms-key-delete-scheduled
  title: KMS key deletion scheduled
  description: >
    A KMS key is scheduled for deletion. Any data encrypted under it becomes
    permanently inaccessible after the waiting period — recoverable only via
    CancelKeyDeletion before then.
  severity: critical
  tags: [kms, data-loss, aws, "notify:critical"]
  match:
    field: action
    op: equals
    value: kms.key.delete_scheduled

# =========================================================================
# notify:high — Slack warn, look within an hour
# =========================================================================

- id: aws-access-key-created
  title: IAM access key created
  description: A long-lived access key was created; review whether it is needed.
  severity: high
  tags: [iam, credentials, aws, "notify:high"]
  match:
    field: action
    op: equals
    value: iam.access_key.create

- id: aws-login-profile-created
  title: Console login profile created
  description: A console password was set on an IAM user — possible persistence.
  severity: high
  tags: [iam, persistence, aws, "notify:high"]
  match:
    field: action
    op: equals
    value: iam.login_profile.create

- id: aws-inline-wildcard-policy
  title: Inline policy granting wildcard permissions
  description: An inline policy with Action/Resource "*" was attached to a principal.
  severity: high
  tags: [iam, privilege-escalation, aws, "notify:high"]
  match:
    all:
      - field: action
        op: in
        value: [iam.policy.put_inline, iam.policy.create_version]
      - field: extra.wildcard_policy
        op: equals
        value: true

- id: aws-kms-key-disabled
  title: KMS key disabled
  description: A KMS key was disabled — data encrypted under it can no longer be decrypted until re-enabled.
  severity: high
  tags: [kms, data-loss, aws, "notify:high"]
  match:
    field: action
    op: equals
    value: kms.key.disable

# =========================================================================
# notify:medium — daily review channel
# =========================================================================

- id: aws-iam-user-created
  title: IAM user created
  description: A new IAM user was created — review who and why.
  severity: medium
  tags: [iam, aws, "notify:medium"]
  match:
    field: action
    op: equals
    value: iam.user.create

- id: aws-iam-role-created
  title: IAM role created
  description: A new IAM role was created — review the trust policy.
  severity: medium
  tags: [iam, aws, "notify:medium"]
  match:
    field: action
    op: equals
    value: iam.role.create

- id: aws-iam-boundary-changed
  title: IAM permissions boundary changed
  description: A permissions boundary was set or removed on a user/role — subtle privilege expansion.
  severity: medium
  tags: [iam, privilege-escalation, aws, "notify:medium"]
  match:
    field: action
    op: in
    value:
      - iam.role.boundary.put
      - iam.role.boundary.delete
      - iam.user.boundary.put
      - iam.user.boundary.delete

- id: aws-kms-grant-created
  title: KMS grant created
  description: >
    A KMS grant was issued — gives the grantee principal cross-account decrypt
    rights without modifying the key policy. Sneaky data-access vector.
  severity: medium
  tags: [kms, persistence, aws, "notify:medium"]
  match:
    field: action
    op: equals
    value: kms.grant.create

- id: aws-cloudtrail-region-deviation
  title: Activity in unexpected region
  description: >
    A CloudTrail event fired in a region you don't normally use. Either a
    teammate is testing somewhere new, or someone is using a fresh region to
    avoid your detections.
  severity: medium
  tags: [audit, aws, "notify:medium"]
  match:
    all:
      - field: source.module
        op: equals
        value: aws.cloudtrail
      - field: region
        op: not_in
        # Edit this list to match your operational regions.
        value: [us-west-1, us-east-1]
