# Secrets Manager detections.
#
# Two shapes worth catching:
#   1. Direct management events — CreateSecret, DeleteSecret, UpdateSecret,
#      RestoreSecret. Low volume. Direct rules.
#   2. GetSecretValue — the raw read event. VOLUMINOUS in normal operation
#      (every app boot fetches its DB password). We do NOT alert on GetSecretValue
#      directly. Instead the pipeline runs each event through UEBA, which
#      emits `iam.anomaly.first_seen_source_ip` / `first_seen_principal` /
#      `first_seen_source_asn` derived events. Alert on the derived UEBA
#      events, not the raw fetches.

- id: aws-secret-deleted
  title: Secret scheduled for deletion
  description: >
    DeleteSecret schedules a secret for removal (with a 7-30 day recovery
    window). Legitimate rotation removes then re-creates — sudden deletes
    of production secrets are worth eyeballing.
  severity: high
  tags: [secrets, iam, destructive, "notify:high"]
  match:
    field: action
    op: equals
    value: secrets.secret.delete

- id: aws-secret-restored
  title: Secret restored (undelete)
  description: >
    RestoreSecret cancelled a pending deletion. If nobody scheduled the delete
    intentionally, this pair (delete → restore) can be an attacker testing
    what they can undo.
  severity: medium
  tags: [secrets, iam, configuration]
  match:
    field: action
    op: equals
    value: secrets.secret.restore

- id: aws-secret-updated
  title: Secret value updated
  description: >
    UpdateSecret changed the secret's value (rotation or manual edit). Log
    for change-tracking — legitimate rotations are frequent; anomaly-based
    alerting via UEBA covers the "who rotated it" question.
  severity: low
  tags: [secrets, iam, configuration]
  match:
    field: action
    op: equals
    value: secrets.secret.update

- id: aws-secret-created
  title: Secret created
  description: >
    CreateSecret added a new secret. Baseline for inventory-tracking; not
    inherently suspicious.
  severity: low
  tags: [secrets, iam, configuration]
  match:
    field: action
    op: equals
    value: secrets.secret.create

# The UEBA anomaly derivations for GetSecretValue land as their own events
# (e.g. iam.anomaly.first_seen_source_ip). If you want dedicated
# high-severity handling for secret-value fetches specifically, add a rule
# matching (action contains "anomaly.first_seen" AND source category == iam
# AND extra.trigger_action == "secrets.secret.get_value"). Left as a future
# refinement — starts firing as soon as UEBA has a warm baseline (~7 days).
