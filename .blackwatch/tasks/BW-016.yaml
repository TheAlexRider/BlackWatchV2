id: BW-016
status: review
title: "Define unique RDS authentication, session, proxy, query, and lifecycle notifications"
area: full-stack
source: research
severity: high
confidence: high
implementation_allowed: true
evidence:
  - file: "blackwatch/modules/aws_rds.py, blackwatch/rds/projection.py,"
    location: "event producers and notification catalog"
    observation: "The module emits event-specific facts that require a dedicated notification contract: database/instance; DB user/source IP; session/backend IDs; reason/error/query class; proxy state; count/window/threshold; duration/idle age; actor/account/region."
  - file: "blackwatch/notify/profiles.py"
    location: "NOTIFICATION_CATALOG and rollout metadata"
    observation: "The current catalog or rollout status does not yet provide a unique contract for every event in this module."
impact: "Recipients may miss the decision-critical facts or take the wrong response when different event types are rendered with shared generic prose."
scope_events:
  - "rds.auth.*"
  - "rds.instance.*"
  - "rds.snapshot.modify"
  - "rds.session.*"
  - "rds.query.*"
  - "rds.error"
  - "rds.proxy.*"
  - "rds.parameter_group.modify"
  - "rds.user.unknown"
acceptance_criteria:
  - "Keep the shared outer notification structure and define event-specific headline, What happened, Facts, Decision, Next steps, Evidence, and Recovery semantics."
  - "Inventory every event key emitted by the producer and either add a unique profile contract or explicitly classify the producer action as non-notifying/future; do not silently treat missing catalog entries as covered."
  - "Source every rendered fact from a normalized envelope field or a named producer extra field; omit unavailable values and never invent identities, thresholds, impact, or recovery."
  - "Add representative complete and partial fixtures plus golden rendering tests for email/plain text and one chat channel, including recovery or manual-resolution behavior where applicable."
  - "Preserve event identifiers, saved profile IDs, routes, channels, throttling, silence settings, advanced templates, audit history, and all existing database data. Any producer additions must be additive."
  - "Expose event-specific field guidance, preview data, rollout status, and content gaps in Notification Studio before marking the module rolled out."
  - "Recovery rule: Use session IDs for session start/end, exact state transitions for concurrent/idle conditions, and manual resolution for schema/configuration/security changes."
  - "Module-specific requirement: Keep auth failure, auth burst, unknown user, proxy source, session, query, and instance changes as separate contracts; do not use one database template."
dependencies:
  - BW-015
risks:
  - "Producer payloads may be incomplete or differ between live and derived events; missing-field behavior must be explicit."
  - "A broad module contains security, operational, and recovery events; do not approve the module until each event family has separate tests."
proposed_role: "coder-backend + coder-ui + coder-tests"
approved_by: user
notes: "Implemented unique event-level RDS contracts for all 22 catalog events, including authentication, sessions, proxy, query, error, lifecycle, and unknown-user semantics. Focused tests pass; review producer fixtures before deployment."
