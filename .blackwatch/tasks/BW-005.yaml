id: BW-005
status: review
title: Complete contextual notification profiles across all modules
area: full-stack
source: notification-r-and-d-and-qa
severity: high
confidence: high
implementation_allowed: true
evidence:
  - file: blackwatch/services/projection.py
    location: "100-196"
    observation: "The service domain already emits distinct service.down, service.degraded, service.up, probe-agent first-seen, and recovered event kinds with status, latency, error, environment, and downtime context."
  - file: blackwatch/services/staleness.py
    location: "15-55"
    observation: "Probe-agent silence emits age, last report, VPC, and monitoring-impact context, but the human-facing body is hardcoded."
  - file: rules/ecs.yaml
    location: "1-84"
    observation: "Service and probe-agent event kinds already have separate detection/routing semantics and severity tiers."
impact: "Every supported module and alert kind can explain what happened, how it is monitored, the evidence, blast radius, and the first remediation steps; service/probe alerts validate the model against rich operational context."
acceptance_criteria:
  - "Keep one explicit Notification Studio profile for every supported module and alert kind, including EC2/FIM, RDS, IAM/CloudTrail, S3, API Gateway, posture, backup, EFS, network, secrets, VPN, services/probes, certificates, UEBA, and future catalog additions."
  - "Create separate profiles for service.down, service.degraded, service.unknown, service.up, probe.agent.stale, probe.agent.recovered, and probe.agent.first_seen."
  - "Expose safe module-specific context fields, including monitor method/tier, VPC, service, error signal, consecutive-failure evidence, latency, last report, downtime, impact, and next steps."
  - "Move human-facing wording out of projection/staleness helpers whenever a profile exists, while preserving structured facts and a fallback message for unmigrated installations."
  - "Allow different channels, thresholds, throttle/digest policy, and recovery behavior for every alert kind without changing the shared delivery worker."
  - "Include a preview/test-send example for every cataloged event kind and explain available fields in the UI."
  - "Verify an event-kind profile cannot render for another event kind unless the operator explicitly creates that scope."
  - "Add regression tests for hysteresis, stale-agent context, complete catalog coverage, profile selection, profile-specific rendering, and fallback behavior."
dependencies:
  - BW-004
risks:
  - "Availability alerts are operationally sensitive; migration must not change existing severity or notification delivery unintentionally."
  - "Runbook text may become stale; support links and versioned profile changes rather than embedding long procedures in every message."
proposed_role: coder-backend + coder-ui + coder-tests
approved_by: user
notes: "Broadened and approved by the user. Implement complete module/event-kind coverage using the BW-004 compatibility layer; services/probes remain the rich validation set, not the product boundary."
