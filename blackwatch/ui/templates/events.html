{% extends "base.html" %}
{% block title %} · Events{% endblock %}
{% block content %}
<h1>Events</h1>

<form class="filters" method="get" action="/ui/events">
  <input type="text" name="q" placeholder="search…" value="{{ filters.q }}">
  <select name="severity">
    <option value="">any severity</option>
    {% for s in severity_order if s != 'unscored' %}
    <option value="{{ s }}" {% if filters.severity == s %}selected{% endif %}>{{ s }}</option>
    {% endfor %}
  </select>
  <input type="text" name="category" placeholder="category" value="{{ filters.category }}">
  <input type="text" name="module" placeholder="module" value="{{ filters.module }}">
  <input type="text" name="action" placeholder="action" value="{{ filters.action }}">
  <button type="submit">Filter</button>
  <a href="/ui/events" style="align-self:center">reset</a>
</form>

<div class="card">
  <p class="muted">{{ events|length }} event(s)</p>
  {% include "_event_rows.html" %}
</div>
{% endblock %}
